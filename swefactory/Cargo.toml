[package]
name = "factory"
version = "0.1.0-rc.3"
edition = "2021"
description = "swefactory — the software factory as a product (single static binary)"
license = "MIT"
repository = "https://github.com/mrdankuta/swefactory"
homepage = "https://github.com/mrdankuta/swefactory"

[[bin]]
name = "factory"
path = "src/main.rs"

# Ticket #28 (spec #27 prefactor): command implementations live in the
# library so Axum handlers and the CLI call the same functions.
[lib]
name = "factory_lib"
path = "src/lib.rs"

[dependencies]
askama = "0.16.1"
axum = "0.8.9"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"

[workspace]
resolver = "2"

# cargo-dist release pipeline (ticket #12): a pushed v* tag ships
# per-platform tarballs plus shell/PowerShell installers and a Homebrew
# formula. Linux builds target musl for a fully static binary.
# Release profile for cargo-dist builds (what `dist init` generates).
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
cargo-dist-version = "0.33.0"
# CI is hand-maintained (product lives in swefactory/, not repo root,
# which the generator does not model): do not fail plan on workflow drift.
allow-dirty = ["ci"]
ci = "github"
installers = ["shell", "powershell", "homebrew"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-musl",
]
