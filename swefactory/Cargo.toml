[package]
name = "factory"
version = "0.1.0-rc.5"
edition = "2021"
description = "swefactory — the software factory as a product (single static binary)"
license = "MIT"
repository = "https://github.com/mrdankuta/swefactory"
# Ticket #36: the Pages download home (rendered by oranda from cargo-dist
# releases). `repository` below stays the GitHub repo — dist requires it.
homepage = "https://mrdankuta.github.io/swefactory/"

[[bin]]
name = "factory"
path = "src/main.rs"

# Ticket #28 (spec #27 prefactor): command implementations live in the
# library so Axum handlers and the CLI call the same functions.
[lib]
name = "factory_lib"
path = "src/lib.rs"

[dependencies]
askama = "0.16.1"
axum = "0.8.9"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Ticket #29 (spec #27 board): Tokio runtime serves the Axum router from
# the same binary. Minimal features: multi-thread runtime + macros for
# `#[tokio::test]` in endpoint tests, net/time for `axum::serve`.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"

[workspace]
resolver = "2"

# cargo-dist release pipeline (ticket #12): a pushed v* tag ships
# per-platform tarballs plus shell/PowerShell installers and a Homebrew
# formula. Linux builds target musl for a fully static binary.
# Release profile for cargo-dist builds (what `dist init` generates).
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
cargo-dist-version = "0.33.0"
# CI is hand-maintained (product lives in swefactory/, not repo root,
# which the generator does not model): do not fail plan on workflow drift.
allow-dirty = ["ci"]
ci = "github"
installers = ["shell", "powershell", "homebrew"]
# Ticket #37: publish the Homebrew formula to the tap repo so
# `brew install mrdankuta/tap/factory` stays fresh. cargo-dist generates
# the publish leg in release.yml (needs HOMEBREW_TAP_TOKEN secret).
tap = "mrdankuta/homebrew-tap"
publish-jobs = ["homebrew"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-musl",
]
