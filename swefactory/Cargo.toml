[package]
name = "factory"
version = "0.1.0"
edition = "2021"
description = "swefactory — the software factory as a product (single static binary)"
license = "MIT"
repository = "https://github.com/mrdankuta/swefactory"
homepage = "https://github.com/mrdankuta/swefactory"

[[bin]]
name = "factory"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"

[workspace]
resolver = "2"

# cargo-dist release pipeline (ticket #12): a pushed v* tag ships
# per-platform tarballs plus shell/PowerShell installers and a Homebrew
# formula. Linux builds target musl for a fully static binary.
[workspace.metadata.dist]
cargo-dist-version = "0.33.0"
ci = "github"
installers = ["shell", "powershell", "homebrew"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-musl",
]
