[package]
name = "factory-shell"
version = "0.1.0"
edition = "2021"

# Tauri shell for the factory desktop client (spec #149, ticket #156).
# Standalone crate (outside the swefactory workspace): the backend calls
# factory_lib in-process; hc stays a sidecar binary (FACTORY_HC_BIN).

[[bin]]
name = "factory-shell"
path = "main.rs"

[dependencies]
factory_lib = { package = "factory", path = "../../swefactory" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
tempfile = "3"
