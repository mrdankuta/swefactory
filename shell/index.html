<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Factory</title>
  </head>
  <body>
    <!-- Ticket #150: left rail mounts the server-rendered rail
         (desktop_left_rail_html: switcher + agents sidebar).
         Selecting a project scopes board + agents + detail. -->
    <div id="left-rail" data-left-rail></div>
    <!-- Ticket #151: center board over the DesktopBoard feed (To Do /
         Review / Done from issue labels). The backend polls `board_feed`
         every 45s (30-60s bound); an unreachable tracker re-serves the
         last cache with a stale banner. Clicking a card invokes
         `board_select` and scopes the detail pane
         (`data-selected-card` + `data-scopes="detail"`). -->
    <main id="board" data-board-fragment data-selected-card data-scopes="detail"></main>
    <!-- Ticket #153: detail pane serves the ticket detail (spec freeze
         hash from the watched factory cache + acceptance criteria +
         latest checks output) with Sync/Check/Handoff Run buttons.
         Run buttons invoke the backend commands and render pass/fail
         inline with the cause named. -->
    <section id="detail" data-detail-pane data-detail-runs>
      <div data-detail-body></div>
      <div data-run-buttons>
        <button data-run="sync">Run sync</button>
        <button data-run="check">Run check</button>
        <button data-run="handoff">Run handoff</button>
      </div>
      <p data-run-outcome aria-live="polite"></p>
    </section>
    <!-- Click-to-peek renders desktop_peek_html(addr, hc read stream). -->
    <section id="peek" data-peek-mount></section>
    <script type="module">
      import { invoke } from "@tauri-apps/api/core";
      const boot = await invoke("shell_boot");
      document.getElementById("left-rail").dataset.backend = boot.backend;
      async function refreshRail() {
        const projects = await invoke("list_projects");
        const agents = await invoke("agents_snapshot");
        const active = document.getElementById("left-rail").dataset.activeProject || null;
        // Rendering is server-side (factory_lib HTML); the client mounts it.
        const { render_left_rail } = await import("./rail.js").catch(() => ({}));
        if (render_left_rail) render_left_rail({ projects, agents, active });
      }
      await refreshRail();
      // Ticket #151: center-board poll (45s, inside the 30-60s bound).
      // Read-only: `board_feed` runs `gh issue list` only; a stale feed
      // keeps the last cache visible with its stale banner.
      let last = null;
      async function refreshBoard() {
        const feed = await invoke("board_feed", { last });
        last = feed;
        const board = document.getElementById("board");
        board.dataset.stale = String(feed.stale);
        board.dataset.pollMs = "45000";
      }
      // Click-to-select: registered a single time (outside the poll loop) so
      // repeated clicks keep scoping #detail.
      document.getElementById("board").addEventListener("click", async (ev) => {
        const card = ev.target.closest("[data-card]");
        if (!card) return;
        const number = Number(card.dataset.card);
        const picked = await invoke("board_select", { feed: last, number });
        if (picked) {
          const board = document.getElementById("board");
          board.dataset.selectedCard = String(picked.number);
          const detail = document.getElementById("detail");
          detail.dataset.ticket = String(picked.number);
          // Ticket #153: serve the detail (freeze + criteria + checks)
          // through the backend; Run buttons call run_sync/run_check/
          // run_handoff and render pass/fail inline with the cause named.
          const full = await invoke("ticket_detail", { number: picked.number, tail: 50 });
          if (full) detail.querySelector("[data-detail-body]").textContent = full.checks_output;
        }
      });
      document.getElementById("detail").addEventListener("click", async (ev) => {
        const btn = ev.target.closest("[data-run]");
        if (!btn) return;
        const detail = document.getElementById("detail");
        const ticket = detail.dataset.ticket;
        const out = document.querySelector("[data-run-outcome]");
        let outcome = null;
        if (btn.dataset.run === "sync") outcome = await invoke("run_sync", { issue: ticket });
        if (btn.dataset.run === "check") outcome = await invoke("run_check");
        if (btn.dataset.run === "handoff") outcome = await invoke("run_handoff", { issue: ticket, signal: "ready" });
        if (outcome && out) out.textContent = `${outcome.passed ? "pass" : "fail"}: ${outcome.cause}`;
      });
      await refreshBoard();
      setInterval(refreshBoard, 45000);
    </script>
  </body>
</html>
