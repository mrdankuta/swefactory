name: factory-check
# Elixir/Phoenix template: copy to <project>/.github/workflows/factory-check.yml,
# adjust versions to match your local toolchain (formatter output differs per
# Elixir minor — CI MUST match the version developers run, or format checks
# will disagree on untouched files).

on:
  push:
    branches: ["main", "dev", "factory/**", "feat/**", "integration/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20" # TODO: match local `elixir --version`
          otp-version: "27"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: assets/package-lock.json
      - run: mix deps.get
      - run: npm ci --prefix assets
      - run: ./scripts/factory-check
