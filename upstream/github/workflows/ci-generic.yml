name: factory-check
# Template: copy to <project>/.github/workflows/factory-check.yml and fill TODOs.
# The project gate is scripts/factory-check — CI must run the SAME command.

on:
  push:
    branches: ["main", "dev", "factory/**", "feat/**", "integration/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # TODO: add service containers your tests need (see ci-elixir.yml for postgres).
    steps:
      - uses: actions/checkout@v4
      # TODO: set up your toolchain (see ci-elixir.yml / ci-node.yml / ci-python.yml).
      - run: ./scripts/factory-check
