name: factory-check
# Python template: copy to <project>/.github/workflows/factory-check.yml and
# adjust the version. CI must run the SAME gate as developers.

on:
  push:
    branches: ["main", "dev", "factory/**", "feat/**", "integration/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # TODO: add service containers your tests need (postgres/redis/…).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # TODO: match local `python --version`
          cache: pip
      - run: pip install -r requirements.txt # TODO: match your dep file
      - run: ./scripts/factory-check
